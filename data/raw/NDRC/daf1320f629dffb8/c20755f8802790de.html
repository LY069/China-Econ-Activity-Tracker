                <div class="article_con article_con_title">
                    <div class=TRS_Editor><p>　　5月22日上午，国家发展改革委举行5月份新闻发布会。国家发展改革委政策研究室副主任、委新闻发言人李超出席发布会，介绍近期国家发展改革委推动出台的系列政策文件以及“夏季达沃斯论坛”有关活动安排，并就宏观经济形势、迎峰度夏电力保供、粮食安全、“六张网”建设、外资、“人工智能+”行动、具身智能领域高质量发展、中国品牌日等方面问题，回应媒体关切。70余家境内外媒体80余名记者参加本场发布会。</p><div><div style="text-align: center;"><img src="./W020260522661427230855_r75.jpg" width="800" style="font-size: 12pt; border-width: 0px;" alt="" OLDSRC="W020260522661427230855.jpg" /></div><p>&nbsp;</p><div>　　<a href="https://www.ndrc.gov.cn/xwdt/wszb/202605xwfbh/">发布会实录</a></div></div></div>
