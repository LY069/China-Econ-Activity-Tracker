            <div class="article_con">
                <div class=TRS_Editor><p align="center"><font face="微软雅黑" style="font-size: 18pt">国家发展改革委举行9月份新闻发布会</font></p><p align="center"><font face="微软雅黑" style="font-size: 18pt">介绍宏观经济运行情况并回应热点问题</font></p><p align="justify">　　</p><p align="center"><img style="border-left-width: 0px; border-right-width: 0px; border-bottom-width: 0px; border-top-width: 0px" alt="" complete="complete" oldsrc="W020191023498797852499.jpg" src="./W020191023498797852499_r75.jpg" /></p><p align="center">&nbsp;</p><p align="justify">　　9月18日上午，国家发展改革委举行9月份新闻发布会。政研室副主任、委新闻发言人孟玮出席发布会，介绍了经济运行、建立健全企业家参与涉企政策制定机制等情况，并就铁路项目投资、市场准入负面清单、稳就业、天然气迎峰度冬、东北地区营商环境试评价等问题，回答了与会记者提问。70余家境内外新闻媒体80多名记者参加了本场发布会。</p><p align="justify">&nbsp;</p><p align="center"><img style="border-left-width: 0px; border-right-width: 0px; border-bottom-width: 0px; border-top-width: 0px" alt="" complete="complete" oldsrc="W020191023498798001451.jpg" src="./W020191023498798001451_r75.jpg" /></p><p align="center">&nbsp;</p><p align="justify">　　附：<a oldsrc="W020191023498798182029.docx" href="./W020191023498798182029.docx">发布会文字实录</a></p></div>
