                <div class="article_con article_con_title">
                    <div class=TRS_Editor><p style="text-align: right;"><img src="./W020230517538296427930_r75.jpg" style="border-width: 0px;" alt="" OLDSRC="W020230517538296427930.jpg" /></p><p style="text-align: right;"><font size="1">高弘杰 摄</font></p><p>　　5月17日上午，国家发展改革委举行5月份新闻发布会。委新闻发言人孟玮出席发布会，介绍发用电、投资项目审批、中巴经济走廊以及最新出台的政策文件等情况，就建设现代化产业体系、制造业恢复发展、物价走势、稳定和扩大就业、补齐农村充电设施短板、支持新能源汽车下乡、推动新能源汽车产业发展、促进家政行业提质增效以及中国品牌日活动等方面问题，回答了记者提问。50余家境内外新闻媒体60余名记者参加本场发布会。</p><div>　　<b><u><font color="#0000ff"><a href="https://www.ndrc.gov.cn/xwdt/wszb/5yfxwfbh/">发布会实录</a></font></u></b></div><div style="text-align: right;"><img src="./W020230517538296657074_r75.jpg" style="border-width: 0px;" alt="" OLDSRC="W020230517538296657074.jpg" /></div><div style="text-align: right;"><font size="1">高弘杰 摄</font></div></div>
