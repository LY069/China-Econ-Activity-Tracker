.filters{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;padding:12px 20px;color:var(--ink2);font-size:13px}
.seg{display:inline-flex;gap:4px}
main{padding:0 20px 40px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,520px),1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px 10px;min-width:0}
.card h3{margin:0;font-size:15px;font-weight:620}
.card .csub{color:var(--ink2);font-size:12px;margin:2px 0 6px}
.chart{width:100%;height:300px}
.prov{color:var(--muted);font-size:11.5px;border-top:1px solid var(--border);margin-top:6px;padding-top:6px;display:flex;flex-wrap:wrap;gap:4px 10px}
.prov a{color:var(--ink2)}
.prov details{width:100%}
.prov summary{cursor:pointer}
.empty{height:300px;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--ink2);font-size:13px;padding:20px;background:var(--wash);border-radius:8px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.tile{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px}
.tile .lab{color:var(--ink2);font-size:12px}
.tile .val{font-size:24px;font-weight:620;margin-top:2px}
.tile .meta{color:var(--muted);font-size:11.5px}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--border);vertical-align:top}
th{color:var(--ink2);font-weight:600;position:sticky;top:0;background:var(--surface)}
td.num{text-align:right;font-variant-numeric:tabular-nums}
.tablewrap{max-height:520px;overflow:auto;border:1px solid var(--border);border-radius:8px}
.status{display:inline-flex;align-items:center;gap:5px;font-weight:600;font-size:12px;white-space:nowrap}
.status i{width:9px;height:9px;border-radius:50%;display:inline-block}
.PASS i{background:var(--good)} .WARN i{background:var(--warning)} .FAIL i{background:var(--critical)} .NOT_TESTABLE i{background:var(--neutral)}
.banner{margin:0 20px 12px;padding:10px 14px;border-radius:10px;border:1px solid var(--border);background:var(--surface);font-size:13px}
.banner strong{font-weight:650}
.note{color:var(--ink2);font-size:13px;max-width:900px}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:4px 12px;font-size:13px}
.kv div:nth-child(odd){color:var(--ink2)}
.check{font-size:13px;margin:2px 0}
.check b{font-weight:600}
h2{font-size:16px;margin:18px 0 8px;font-weight:640}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px}
@media (max-width:600px){header,main,.filters{padding-left:16px;padding-right:16px}.banner{margin:0 16px 12px}.chart,.empty{height:260px}}
</style>
</head>
<body>
<header>
  <div>
    <h1>China economic activity tracker</h1>
    <div class="sub">Official statistics and high-frequency fiscal and project data. Every number links to its dataset and raw source.</div>
  </div>
  <div class="hdr-right">
    <span id="asof">Loading…</span>
    <span id="refresh-state"></span>
    <button id="refresh" title="Reload data now">Refresh</button>
    <button id="theme" title="Toggle light/dark">Theme</button>
  </div>
</header>
<div id="banner"></div>
<nav id="tabs" role="tablist"></nav>
<div class="filters" id="filters">
  <span>Range</span>
  <span class="seg" id="range"></span>
  <span id="viewfilters"></span>
</div>
<main id="main"></main>

<script>
"use strict";
const REFRESH_MIN = 15;
const RANGES = [["3y",3],["5y",5],["10y",10],["All",99]];
const state = {tab: "overview", range: 5, mode: {}, data: null, charts: [], lastLoad: null, llPair: 0, llLag: null};
try { const s = JSON.parse(localStorage.getItem("cat-state")||"{}"); Object.assign(state, {tab:s.tab||state.tab, range:s.range||state.range}); } catch(e) {}
function save(){ try{ localStorage.setItem("cat-state", JSON.stringify({tab:state.tab, range:state.range})); }catch(e){} }

const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const SERIES_VARS = ["--s1","--s2","--s3","--s4","--s5","--s6","--s7","--s8"];
const el = (tag, attrs={}, ...kids) => { const e=document.createElement(tag); for(const[k,v] of Object.entries(attrs)){ if(k==="class") e.className=v; else if(k.startsWith("on")) e.addEventListener(k.slice(2),v); else if(v!==undefined&&v!==null) e.setAttribute(k,v);} for(const k of kids){ if(k==null) continue; e.append(k.nodeType?k:document.createTextNode(String(k))); } return e; };
const axfmt = v => Math.abs(v)>=1e4 ? (v/1e3).toLocaleString()+"K" : String(+Number(v).toFixed(2));
const fmt = (v, d=1) => v==null||isNaN(v) ? "–" : Math.abs(v)>=1e4 ? (v/1e3).toLocaleString(undefined,{maximumFractionDigits:1})+"K" : Number(v).toLocaleString(undefined,{maximumFractionDigits:d, minimumFractionDigits:d});

// ---------------------------------------------------------------- data loading
const FILES = ["meta","catalog","analytics","validation","breaks","bonds","source_status"];
async function load(){
  let d;
  if (window.__INLINE_DATA__) d = window.__INLINE_DATA__;
  else {
    d = {};
    await Promise.all(FILES.map(async f => {
      try { const r = await fetch(`data/${f}.json?t=${Date.now()}`, {cache:"no-store"}); d[f] = r.ok ? await r.json() : null; }
      catch(e){ d[f] = null; }
    }));
  }
  state.data = d; state.lastLoad = new Date();
  render();
}
setInterval(() => { if (!document.hidden && !window.__INLINE_DATA__) load(); }, REFRESH_MIN*60*1000);
document.addEventListener("visibilitychange", () => { if (!document.hidden && state.lastLoad && (Date.now()-state.lastLoad)>REFRESH_MIN*60*1000 && !window.__INLINE_DATA__) load(); });

// ---------------------------------------------------------------- series helpers
function S(id){ const c = state.data?.catalog?.[id]; return c || null; }
function cutoff(){ const d=new Date(); d.setFullYear(d.getFullYear()-state.range); return d.toISOString().slice(0,10); }
function pts(id){ const s=S(id); if(!s) return []; const c=cutoff(); const out=[]; for(let i=0;i<s.t.length;i++){ if(s.t[i]>=c) out.push([s.t[i], s.v[i]]);} return out; }
function last(id){ const s=S(id); if(!s||!s.t.length) return null; return {t:s.t[s.t.length-1], v:s.v[s.v.length-1]}; }
function globMatch(pat, id){ const rx = new RegExp("^"+pat.replace(/[.+^${}()|[\]\\]/g,"\\$&").replace(/\*/g,".*")+"$"); return rx.test(id); }
function breaksFor(ids){
  const out=[]; for(const b of (state.data?.breaks||[])){ if(String(b.date)==="annual") continue;
    if((b.series||[]).some(p => ids.some(id => globMatch(p, id) || globMatch(p, id.split("~")[0])))) out.push(b); }
  return out;
}

// ---------------------------------------------------------------- chart factory
function chartCard({title, sub, series, type="line", unit="", stack=false, zero=false, note, std=false, bands}){
  const card = el("div",{class:"card"});
  card.append(el("h3",{},title));
  if (sub) card.append(el("div",{class:"csub"}, sub));
  const avail = series.filter(s => S(s.id) && S(s.id).t.length);
  if (!avail.length){
    const why = missingReason(series.map(s=>s.id));
    card.append(el("div",{class:"empty"}, "No data yet. ", why));
    card.append(provBlock(series.map(s=>s.id)));
    return card;
  }
  const box = el("div",{class:"chart",role:"img","aria-label":title});
  card.append(box);
  const tableBtn = el("button",{style:"font-size:12px;padding:3px 8px;margin-top:6px"},"Table view");
  const tableBox = el("div",{style:"display:none;margin-top:6px"});
  tableBtn.addEventListener("click",()=>{ const on = tableBox.style.display==="none"; tableBox.style.display = on?"block":"none"; tableBtn.textContent = on?"Hide table":"Table view"; if(on && !tableBox.firstChild) tableBox.append(seriesTable(avail)); });
  card.append(tableBtn, tableBox);
  if (note) card.append(el("div",{class:"csub",style:"margin-top:6px"}, note));
  card.append(provBlock(series.map(s=>s.id)));
  requestAnimationFrame(()=>drawChart(box, {series:avail, type, unit, stack, zero, std, bands}));
  return card;
}

function zscore(p){ const v=p.map(x=>x[1]); const m=v.reduce((a,b)=>a+b,0)/v.length; const sd=Math.sqrt(v.reduce((a,b)=>a+(b-m)**2,0)/Math.max(v.length-1,1))||1; return p.map(([t,x])=>[t,(x-m)/sd]); }

function drawChart(box, {series, type, unit, stack, zero, std, bands}){
  const ch = echarts.init(box, null, {renderer:"svg"});
  state.charts.push(ch);
  const ink2 = css("--ink2"), muted=css("--muted"), grid=css("--grid"), axis=css("--axis"), surface=css("--surface"), ink=css("--ink");
  const brks = breaksFor(series.map(s=>s.id));
  const cut = cutoff();
  const marks = brks.filter(b => String(b.date) >= cut).map(b => ({xAxis:String(b.date), label:{formatter:b.id.replace(/_/g," "), color:muted, fontSize:10, position:"insideEndTop"}, lineStyle:{color:axis, type:"solid", width:1}}));
  const opt = {
    animation:false, backgroundColor:"transparent",
    grid:{left:8,right:16,top:series.length>1?(series.length>5?52:34):14,bottom:8,containLabel:true},
    legend: series.length>1 ? {top:0,left:0,itemWidth:14,itemHeight:type==="line"?2:8,textStyle:{color:ink2,fontSize:12},icon:type==="line"?"rect":"roundRect"} : undefined,
    tooltip:{trigger:"axis",axisPointer:{type:"line",lineStyle:{color:axis}},backgroundColor:surface,borderColor:css("--border"),textStyle:{color:ink,fontSize:12},
      valueFormatter:v=> v==null?"–":fmt(v, Math.abs(v)<100?2:0)+(std?" sd":unit==="%"||unit==="pp"?" "+unit:"")},
    xAxis:{type:"time",axisLine:{lineStyle:{color:axis}},axisTick:{show:false},axisLabel:{color:muted,fontSize:11,hideOverlap:true},splitLine:{show:false}},
    yAxis:{type:"value",scale:!zero,axisLabel:{color:muted,fontSize:11,formatter:axfmt},splitLine:{lineStyle:{color:grid,width:1}},name:std?"standardised (sd)":"",nameTextStyle:{color:muted,fontSize:11,align:"left"}},
    series: series.map((s,i) => {
      let data = pts(s.id); if (std) data = zscore(data);
      const color = css(SERIES_VARS[(s.slot ?? i) % 8]);
      const base = {name:s.label||S(s.id).meta.name||s.id, data, color};
      if ((s.type||type)==="bar") return {...base, type:"bar", stack: stack?"a":undefined, barMaxWidth:24, itemStyle:{borderRadius: stack?0:[4,4,0,0], borderColor: stack?surface:undefined, borderWidth: stack?1:0}, emphasis:{focus:"series"}};
      return {...base, type:"line", showSymbol:false, symbolSize:8, lineStyle:{width:2,cap:"round",join:"round"}, connectNulls:false, emphasis:{focus:"series"}};
    })
  };
  if (marks.length) opt.series[0].markLine = {symbol:"none", silent:false, data:marks, tooltip:{show:true, formatter:p=>brks.find(b=>String(b.date)===p.value || b.id.replace(/_/g," ")===p.name)?.what||p.name}};
  if (bands && opt.series[0]) opt.series[0].markLine = {...(opt.series[0].markLine||{symbol:"none",data:[]}), data:[...(opt.series[0].markLine?.data||[]), ...bands.map(y=>({yAxis:y,label:{show:false},lineStyle:{color:axis,type:"solid",width:1}}))]};
  ch.setOption(opt);
}

function seriesTable(series){
  const ids = series.map(s=>s.id); const map = new Map();
  ids.forEach((id,j)=>pts(id).forEach(([t,v])=>{ if(!map.has(t)) map.set(t, Array(ids.length).fill(null)); map.get(t)[j]=v; }));
  const rows = [...map.entries()].sort((a,b)=>b[0].localeCompare(a[0]));
  const tbl = el("table"); const thead = el("tr",{}, el("th",{},"Period"), ...ids.map(id=>el("th",{}, S(id)?.meta?.name||id)));
  tbl.append(el("thead",{},thead)); const tb = el("tbody");
  rows.forEach(([t,vals]) => tb.append(el("tr",{}, el("td",{},t), ...vals.map(v=>el("td",{class:"num"}, fmt(v,2))))));
  tbl.append(tb); return el("div",{class:"tablewrap",style:"max-height:260px"}, tbl);
}

function provBlock(ids){
  const p = el("div",{class:"prov"});
  const det = el("details"); det.append(el("summary",{}, `Datasets (${ids.length}): trace each series`));
  const list = el("div",{class:"mono"});
  ids.forEach(id => {
    const s = S(id);
    const row = el("div",{style:"margin:3px 0"});
    row.append(el("b",{},id), " — ");
    if (!s){ row.append("not in store"); list.append(row); return; }
    const pr = s.prov;
    row.append(`${pr.tier}`, " · ", pr.source, " · vintage ", pr.vintage||"?", " · ", pr.lineage||"");
    if (pr.url){ row.append(" · "); row.append(el("a",{href:pr.url,target:"_blank",rel:"noopener"},"source")); }
    if (pr.raw_file){ row.append(" · raw: ", pr.raw_file); }
    if (s.note) row.append(" · ", s.note);
    if (pr.tier==="fallback") row.append(el("b",{style:"color:var(--ink)"}," · FALLBACK SOURCE"));
    list.append(row);
  });
  det.append(list); p.append(det);
  const l = ids.map(last).filter(Boolean).sort((a,b)=>b.t.localeCompare(a.t))[0];
  if (l) p.prepend(el("span",{},`Latest period ${l.t}`));
  return p;
}

function missingReason(ids){
  const st = state.data?.source_status || {};
  const reach = st._reachability || {};
  const down = Object.entries(reach).filter(([k,v])=>!v.ok).map(([k])=>k);
  if (!state.data?.catalog || !Object.keys(state.data.catalog).length) return "The store is empty: no source has been ingested yet." + (down.length?` Unreachable from the build environment: ${down.join(", ")}.`:"");
  return down.length ? `Unreachable at last build: ${down.join(", ")}. See Data & sources.` : "Series not produced at last build; see Data & sources.";
}

// ---------------------------------------------------------------- views
const VIEWS = {
  overview: {label:"Overview", render: renderOverview},
  gdp: {label:"GDP", render: () => [
    chartCard({title:"Real GDP growth", sub:"% y/y, quarterly · NBS", unit:"%", series:[{id:"gdp.real_yoy",label:"Real GDP y/y"}]}),
    chartCard({title:"Real GDP, q/q seasonally adjusted (NBS)", sub:"% q/q · NBS published SA", unit:"%", type:"bar", zero:true, series:[{id:"gdp.sa_qoq",label:"GDP q/q SA"}]}),
    chartCard({title:"Contributions to real GDP growth by sector", sub:"pp · prior-year nominal share × sector real growth (tracker estimate)", unit:"pp", type:"bar", stack:true, zero:true,
      series:[{id:"gdp.contrib_primary",label:"Primary"},{id:"gdp.contrib_secondary",label:"Secondary"},{id:"gdp.contrib_tertiary",label:"Tertiary"}],
      note:"Approximation; sum differs from headline by chain-weighting effects. NBS-published contributions shown below (annual)."}),
    chartCard({title:"Contributions by expenditure (NBS, annual)", sub:"pp of real GDP growth", unit:"pp", type:"bar", stack:true, zero:true,
      series:[{id:"gdp.contrib_consumption",label:"Consumption"},{id:"gdp.contrib_investment",label:"Investment"},{id:"gdp.contrib_netexports",label:"Net exports"}]}),
    chartCard({title:"Sector real growth", sub:"% y/y · NBS", unit:"%", series:[{id:"gdp.primary_real_yoy",label:"Primary"},{id:"gdp.secondary_real_yoy",label:"Secondary"},{id:"gdp.tertiary_real_yoy",label:"Tertiary"}]}),
  ]},
  activity: {label:"Activity", filters:{measure:[["yoy","y/y"],["sa","SA m/m"],["real","Real y/y"],["level","Level"]]}, render: renderActivity},
  credit: {label:"Credit", render: () => [
    chartCard({title:"Credit impulse", sub:"Δ12m of 12-month credit flow, % of trailing 4Q nominal GDP · tracker calc from PBoC + NBS", unit:"%", zero:true,
      series:[{id:"tsf.flow~impulse",label:"TSF"},{id:"tsf.flow_ex_govt~impulse",label:"TSF ex-govt bonds"},{id:"loans.total~impulse",label:"RMB loans"}]}),
    chartCard({title:"Total social financing: monthly flow by component", sub:"RMB bn · PBoC", unit:"RMB bn", type:"bar", stack:true, zero:true,
      series:[{id:"tsf.rmb_loans",label:"RMB loans"},{id:"tsf.govt_bonds",label:"Govt bonds"},{id:"tsf.corp_bonds",label:"Corp bonds"},{id:"tsf.undiscounted_ba",label:"Undiscounted BA"},{id:"tsf.equity",label:"Equity"},{id:"tsf.trust",label:"Trust"},{id:"tsf.entrusted",label:"Entrusted"},{id:"tsf.fx_loans",label:"FX loans"}]}),
    chartCard({title:"TSF: 12-month rolling flow", sub:"RMB bn · total vs ex-government bonds", unit:"RMB bn",
      series:[{id:"tsf.flow~12m",label:"TSF"},{id:"tsf.flow_ex_govt~12m",label:"TSF ex-govt"}]}),
    chartCard({title:"TSF stock growth", sub:"% y/y · PBoC published", unit:"%", series:[{id:"tsf.stock_yoy",label:"TSF stock y/y"}]}),
    chartCard({title:"New loans by sector", sub:"RMB bn per month · PBoC (single months from YTD differences)", unit:"RMB bn", type:"bar", stack:true, zero:true,
      series:[{id:"loans.hh_total",label:"Household"},{id:"loans.corp_total",label:"Corporate"},{id:"loans.nbfi",label:"Non-bank FIs"}]}),
    chartCard({title:"New loans by tenor", sub:"RMB bn per month · PBoC", unit:"RMB bn", type:"bar", stack:true, zero:true,
      series:[{id:"loans.hh_short",label:"HH short"},{id:"loans.hh_medlong",label:"HH med/long"},{id:"loans.corp_short",label:"Corp short"},{id:"loans.corp_medlong",label:"Corp med/long"},{id:"loans.corp_bills",label:"Bills"}]}),
    chartCard({title:"M1 and M2 growth", sub:"% y/y · PBoC/NBS", unit:"%", series:[{id:"money.m2_yoy",label:"M2"},{id:"money.m1_yoy",label:"M1"}], note:"M1 redefined from Jan 2025 (household demand deposits + payment-institution reserves added): see break marker."}),
    chartCard({title:"M1 – M2 growth gap", sub:"pp · tracker calc", unit:"pp", zero:true, series:[{id:"money.m1_m2_gap",label:"M1-M2"}]}),
  ]},
  property: {label:"Property", filters:{segment:[["new","New homes"],["used","Second-hand"]]}, render: renderProperty},
  bonds: {label:"Bonds & fiscal", render: renderBonds},
  projects: {label:"Projects", render: () => [
    chartCard({title:"NDRC approved fixed-asset investment projects: value", sub:"RMB bn per month · NDRC press conferences (single-month statements only)", unit:"RMB bn", type:"bar", zero:true,
      series:[{id:"ndrc.approvals_value",label:"Approved investment"},{id:"ndrc.approvals_value~3mma",label:"3m avg",type:"line"}],
      note:"NDRC does not publish a regular series; months without a single-month statement are gaps, not zeros."}),
    chartCard({title:"NDRC approvals: number of projects", sub:"projects per month · NDRC", unit:"projects", type:"bar", zero:true, series:[{id:"ndrc.approvals_count",label:"Projects"}]}),
    projectTypes(),
  ]},
  leadlag: {label:"Lead–lag lab", render: renderLeadLag},
  nowcast: {label:"Nowcast", render: renderNowcast},
  validation: {label:"Validation", render: renderValidation},
  sources: {label:"Data & sources", render: renderSources},
};

function renderOverview(){
  const out = [];
  const tiles = el("div",{class:"tiles"});
  const T = [["gdp.real_yoy","Real GDP","% y/y"],["ip.yoy","Industrial production","% y/y"],["retail.yoy","Retail sales","% y/y"],
    ["fai.ytd_yoy","Fixed-asset investment","% YTD y/y"],["fai.ytd~cyoy","FAI, single month","% y/y (comparable)"],["tsf.flow_ex_govt~impulse","Credit impulse ex-govt","% of GDP"],
    ["money.m1_m2_gap","M1 – M2 gap","pp"],["hp.new.all70.mom","New home prices, 70 cities","% m/m"],["lgb.special_new","New special bonds, latest month","RMB bn"]];
  for (const [id,lab,u] of T){
    const l = last(id); const s=S(id);
    tiles.append(el("div",{class:"tile"}, el("div",{class:"lab"},lab), el("div",{class:"val"}, l?fmt(l.v, Math.abs(l.v)<100?1:0):"–"),
      el("div",{class:"meta"}, l?`${u} · ${l.t} · ${s.prov.source}${s.prov.tier==="fallback"?" (fallback)":""}`:`${u} · no data`)));
  }
  out.push(tiles);
  const g = el("div",{class:"grid"});
  g.append(chartCard({title:"Activity momentum", sub:"% y/y, 3-month average · NBS", unit:"%",
    series:[{id:"ip.yoy~3mma",label:"IP"},{id:"retail.yoy~3mma",label:"Retail"},{id:"fai.ytd~cyoy~3mma",label:"FAI (single month)"}]}));
  g.append(chartCard({title:"Credit and fiscal impulse", sub:"Δ12m of 12-month flow, % of GDP", unit:"%", zero:true,
    series:[{id:"tsf.flow_ex_govt~impulse",label:"Credit ex-govt"},{id:"lgb.new_total~impulse",label:"New local bonds"},{id:"tsf.govt_bonds~impulse",label:"Govt bonds (TSF)"}]}));
  out.push(g);
  out.push(el("h2",{},"Leading-indicator verdicts"));
  const ll = state.data?.analytics?.lead_lag || [];
  const tb = el("table"); tb.append(el("thead",{},el("tr",{},...["Pair","Verdict","Best lead","Prewhitened corr","Placebo p","Granger p","n"].map(h=>el("th",{},h)))));
  const body = el("tbody");
  ll.forEach(r => body.append(el("tr",{}, el("td",{},r.label), el("td",{}, r.verdict || r.status), el("td",{class:"num"}, r.best_lead??"–"),
    el("td",{class:"num"}, fmt(r.best_lead_corr,2)), el("td",{class:"num"}, fmt(r.placebo_p,3)), el("td",{class:"num"}, fmt(r.granger_p,3)), el("td",{class:"num"}, r.n??"–"))));
  tb.append(body); out.push(el("div",{class:"tablewrap"},tb));
  return out;
}

function renderActivity(){
  const m = state.mode.measure || "yoy";
  const C = [];
  if (m==="yoy"){
    C.push(chartCard({title:"Industrial production", sub:"% y/y · NBS", unit:"%", series:[{id:"ip.yoy",label:"y/y"},{id:"ip.yoy~3mma",label:"3m avg"}]}));
    C.push(chartCard({title:"Retail sales", sub:"% y/y · NBS published vs tracker comparable-basis reconstruction", unit:"%", series:[{id:"retail.yoy",label:"Published"},{id:"retail.ytd~cyoy",label:"Reconstructed from YTD"}]}));
    C.push(chartCard({title:"Fixed-asset investment, single month", sub:"% y/y, comparable basis (implied from YTD releases) · tracker calc", unit:"%", series:[{id:"fai.ytd~cyoy",label:"Single month"},{id:"fai.ytd_yoy",label:"YTD (published)"}]}));
    C.push(chartCard({title:"FAI by sector", sub:"% YTD y/y · NBS", unit:"%", series:[{id:"fai.infra_ytd_yoy",label:"Infrastructure (ex power)"},{id:"fai.mfg_ytd_yoy",label:"Manufacturing"},{id:"fai.re_ytd_yoy",label:"Real estate"}]}));

  else {
    const t = el("table"); const cols=["made_at","target","target_period","model","nowcast","actual","error","scored_at"];
    t.append(el("thead",{},el("tr",{},...cols.map(c=>el("th",{},c))))); const b=el("tbody");
    log.slice().reverse().forEach(r=>b.append(el("tr",{},...cols.map(c=>el("td",{class:typeof r[c]==="number"?"num":""}, typeof r[c]==="number"?fmt(r[c],2):(r[c]??"–"))))));
    t.append(b); out.push(el("div",{class:"tablewrap"},t));
    const scored = log.filter(r=>r.error!=null && !isNaN(r.error));
    if (scored.length){ const rmse=Math.sqrt(scored.reduce((s,r)=>s+r.error*r.error,0)/scored.length); out.push(el("p",{class:"note"},`Scored nowcasts: ${scored.length}; live RMSE ${fmt(rmse,2)} pp.`)); }
  }
  return out;
}

function renderValidation(){
  const v = state.data?.validation || []; const out=[];
  const counts = {}; v.forEach(x=>counts[x.status]=(counts[x.status]||0)+1);
  const tiles = el("div",{class:"tiles"});
  [["PASS","Pass"],["WARN","Warn"],["FAIL","Fail"],["NOT_TESTABLE","Not testable"]].forEach(([k,l])=>tiles.append(el("div",{class:"tile"}, el("div",{class:"lab"}, el("span",{class:"status "+k}, el("i"), l)), el("div",{class:"val"}, counts[k]||0))));
  out.push(tiles);
  out.push(el("p",{class:"note"},"Results are accepted only when: accounting identities hold; cross-source reconciliations are within tolerance; published y/y is reproduced; physical proxies agree in direction (or the divergence is explained); nowcasts are logged before release. Not testable means an input is missing, and it never counts as a pass."));
  const groups = [...new Set(v.map(x=>x.group))];
  for (const gname of groups){
    out.push(el("h2",{},gname));
    const tb = el("table"); tb.append(el("thead",{},el("tr",{},...["Check","Status","n","Exceptions","Tolerance","Detail"].map(h=>el("th",{},h)))));
    const body = el("tbody");
    v.filter(x=>x.group===gname).forEach(x=>{
      const det = el("td",{}, x.detail);
      if (x.exceptions?.length){ const d=el("details"); d.append(el("summary",{},`${x.exceptions.length} exception(s)`)); const pre=el("pre",{class:"mono",style:"white-space:pre-wrap;margin:4px 0"}); pre.textContent = x.exceptions.map(e=>JSON.stringify(e)).join("\n"); d.append(pre); det.append(d); }
      body.append(el("tr",{}, el("td",{},x.description), el("td",{}, el("span",{class:"status "+x.status}, el("i"), x.status.replace("_"," "))), el("td",{class:"num"},x.n), el("td",{class:"num"},x.n_exceptions), el("td",{},x.tolerance), det));
    });
    tb.append(body); out.push(el("div",{class:"tablewrap",style:"max-height:none"},tb));
  }
  return out;
}

function renderSources(){
  const d = state.data || {}; const out=[];
  const st = d.source_status || {};
  out.push(el("h2",{},"Source reachability at last build"));
  const reach = st._reachability || {};
  const t1 = el("table"); t1.append(el("thead",{},el("tr",{},...["Source","URL","Reachable","Detail"].map(h=>el("th",{},h)))));
  const b1 = el("tbody"); Object.entries(reach).forEach(([k,v])=>b1.append(el("tr",{},el("td",{},k),el("td",{class:"mono"},v.url),el("td",{}, el("span",{class:"status "+(v.ok?"PASS":"FAIL")},el("i"),v.ok?"yes":"no")),el("td",{class:"mono"},v.detail))));
  t1.append(b1); out.push(el("div",{class:"tablewrap"},t1));
  out.push(el("h2",{},"Ingest results"));
  const t2 = el("table"); t2.append(el("thead",{},el("tr",{},...["Ingest","OK","Detail"].map(h=>el("th",{},h)))));
  const b2 = el("tbody"); Object.entries(st).filter(([k])=>k!=="_reachability").forEach(([k,v])=>{ const {ok, ...rest}=v; const pre=el("pre",{class:"mono",style:"white-space:pre-wrap;margin:0;max-height:160px;overflow:auto"}); pre.textContent=JSON.stringify(rest,null,1); b2.append(el("tr",{},el("td",{},k),el("td",{},el("span",{class:"status "+(ok?"PASS":"FAIL")},el("i"),ok?"yes":"no")),el("td",{},pre))); });
  t2.append(b2); out.push(el("div",{class:"tablewrap"},t2));
  out.push(el("h2",{},"Series catalog"));
  const q = el("input",{type:"search",placeholder:"Filter series…","aria-label":"Filter series",style:"width:min(100%,320px);margin-bottom:8px"});
  const wrap = el("div",{class:"tablewrap"});
  const draw = () => { wrap.textContent=""; const tb=el("table"); const cols=["Series id","Name","Unit","Last period","Last value","Tier","Source","Vintage","Lineage","Raw file"];
    tb.append(el("thead",{},el("tr",{},...cols.map(c=>el("th",{},c))))); const body=el("tbody"); const f=q.value.toLowerCase();
    Object.entries(d.catalog||{}).filter(([id,s])=>!f||id.toLowerCase().includes(f)||(s.meta.name||"").toLowerCase().includes(f)).forEach(([id,s])=>{
      body.append(el("tr",{},el("td",{class:"mono"},id),el("td",{},s.meta.name||""),el("td",{},s.meta.unit||""),el("td",{},s.t[s.t.length-1]),el("td",{class:"num"},fmt(s.v[s.v.length-1],2)),el("td",{},s.prov.tier),el("td",{}, s.prov.url?el("a",{href:s.prov.url,target:"_blank",rel:"noopener"},s.prov.source):s.prov.source),el("td",{},s.prov.vintage),el("td",{class:"mono"},s.prov.lineage),el("td",{class:"mono"},s.prov.raw_file)));
    }); tb.append(body); wrap.append(tb); };
  q.addEventListener("input", draw); draw();
  out.push(q, wrap);
  out.push(el("h2",{},"Structural-break register"));
  const t3 = el("table"); t3.append(el("thead",{},el("tr",{},...["Id","Date","Series","What","Treatment","Status"].map(h=>el("th",{},h)))));
  const b3 = el("tbody"); (d.breaks||[]).forEach(b=>b3.append(el("tr",{},el("td",{class:"mono"},b.id),el("td",{},String(b.date)+(b.end?` → ${b.end}`:"")),el("td",{class:"mono"},(b.series||[]).join(", ")),el("td",{},b.what),el("td",{},b.treatment),el("td",{},b.status))));
  t3.append(b3); out.push(el("div",{class:"tablewrap"},t3));
  return out;
}

// ---------------------------------------------------------------- shell
function render(){
  state.charts.forEach(c=>c.dispose()); state.charts = [];
  const d = state.data || {};
  const meta = d.meta || {};
  document.getElementById("asof").textContent = meta.built_at ? `Data built ${meta.built_at.replace("T"," ").replace("Z"," UTC")} · ${meta.n_series} series` : "No build yet";
  document.getElementById("refresh-state").textContent = window.__INLINE_DATA__ ? "Snapshot (data embedded)" : state.lastLoad ? `Checked ${state.lastLoad.toLocaleTimeString()} · auto-refresh every ${REFRESH_MIN} min` : "";
  const banner = document.getElementById("banner"); banner.textContent = "";
  const reach = d.source_status?._reachability || {};
  const down = Object.entries(reach).filter(([k,v])=>!v.ok).map(([k])=>k);
  const nfb = Object.values(d.catalog||{}).filter(s=>s.prov.tier==="fallback").length;
  if (!d.catalog || !Object.keys(d.catalog).length) banner.append(el("div",{class:"banner"}, el("strong",{},"No data in the store yet. "), down.length?`The build environment could not reach: ${down.join(", ")}. Charts fill in when a build can reach the sources.`:"Run the build to populate the store."));
  else if (down.length || nfb) banner.append(el("div",{class:"banner"}, el("strong",{},"Partial coverage. "), down.length?`Unreachable at last build: ${down.join(", ")}. `:"", nfb?`${nfb} series come from fallback sources and are marked as such.`:""));
  const tabs = document.getElementById("tabs"); tabs.textContent="";
  for (const [k,v] of Object.entries(VIEWS)) tabs.append(el("button",{role:"tab","aria-selected":String(state.tab===k),onclick:()=>{state.tab=k; save(); render();}}, v.label));
  const rg = document.getElementById("range"); rg.textContent="";
  RANGES.forEach(([l,y])=>rg.append(el("button",{"aria-pressed":String(state.range===y),onclick:()=>{state.range=y; save(); render();}}, l)));
  const vf = document.getElementById("viewfilters"); vf.textContent="";
  const view = VIEWS[state.tab] || VIEWS.overview;
  for (const [k,opts] of Object.entries(view.filters||{})){
    const cur = state.mode[k] || opts[0][0];
    const seg = el("span",{class:"seg"}); opts.forEach(([v,l])=>seg.append(el("button",{"aria-pressed":String(cur===v),onclick:()=>{state.mode[k]=v; render();}}, l)));
    vf.append(seg);
  }
  const main = document.getElementById("main"); main.textContent="";
  let content = view.render();
  const needsGrid = ["gdp","activity","credit","property","bonds","projects"].includes(state.tab);
  if (needsGrid){ const g=el("div",{class:"grid"}); content.forEach(c=>g.append(c)); main.append(g); }
  else content.forEach(c=>main.append(c));
}
window.addEventListener("resize", ()=>state.charts.forEach(c=>c.resize()));
document.getElementById("refresh").addEventListener("click", load);
document.getElementById("theme").addEventListener("click", ()=>{
  const root=document.documentElement; const dark = root.dataset.theme ? root.dataset.theme==="dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme = dark ? "light" : "dark"; render();
});
load();
</script>
