const el = (tag, attrs={}, ...kids) => { const e=document.createElement(tag); for(const[k,v] of Object.entries(attrs)){ if(k==="class") e.className=v; else if(k.startsWith("on")) e.addEventListener(k.slice(2),v); else if(v!==undefined&&v!==null) e.setAttribute(k,v);} for(const k of kids){ if(k==null) continue; e.append(k.nodeType?k:document.createTextNode(String(k))); } return e; };
const axfmt = v => Math.abs(v)>=1e4 ? (v/1e3).toLocaleString()+"K" : String(+Number(v).toFixed(2));
const fmt = (v, d=1) => v==null||isNaN(v) ? "–" : Math.abs(v)>=1e4 ? (v/1e3).toLocaleString(undefined,{maximumFractionDigits:1})+"K" : Number(v).toLocaleString(undefined,{maximumFractionDigits:d, minimumFractionDigits:d});

// ---------------------------------------------------------------- data loading
const FILES = ["meta","catalog","analytics","validation","breaks","bonds","source_status"];
async function load(){
  let d;
  if (window.__INLINE_DATA__) d = window.__INLINE_DATA__;
  else {
    d = {};
    await Promise.all(FILES.map(async f => {
      try { const r = await fetch(`data/${f}.json?t=${Date.now()}`, {cache:"no-store"}); d[f] = r.ok ? await r.json() : null; }
      catch(e){ d[f] = null; }
    }));
  }
  state.data = d; state.lastLoad = new Date();
  render();
}
setInterval(() => { if (!document.hidden && !window.__INLINE_DATA__) load(); }, REFRESH_MIN*60*1000);
document.addEventListener("visibilitychange", () => { if (!document.hidden && state.lastLoad && (Date.now()-state.lastLoad)>REFRESH_MIN*60*1000 && !window.__INLINE_DATA__) load(); });

// ---------------------------------------------------------------- series helpers
function S(id){ const c = state.data?.catalog?.[id]; return c || null; }
function cutoff(){ const d=new Date(); d.setFullYear(d.getFullYear()-state.range); return d.toISOString().slice(0,10); }
function pts(id){ const s=S(id); if(!s) return []; const c=cutoff(); const out=[]; for(let i=0;i<s.t.length;i++){ if(s.t[i]>=c) out.push([s.t[i], s.v[i]]);} return out; }
function last(id){ const s=S(id); if(!s||!s.t.length) return null; return {t:s.t[s.t.length-1], v:s.v[s.v.length-1]}; }
function globMatch(pat, id){ const rx = new RegExp("^"+pat.replace(/[.+^${}()|[\]\\]/g,"\\$&").replace(/\*/g,".*")+"$"); return rx.test(id); }
function breaksFor(ids){
  const out=[]; for(const b of (state.data?.breaks||[])){ if(String(b.date)==="annual") continue;
    if((b.series||[]).some(p => ids.some(id => globMatch(p, id) || globMatch(p, id.split("~")[0])))) out.push(b); }
  return out;
}

// ---------------------------------------------------------------- chart factory
function chartCard({title, sub, series, type="line", unit="", stack=false, zero=false, note, std=false, bands}){
  const card = el("div",{class:"card"});
  card.append(el("h3",{},title));
  if (sub) card.append(el("div",{class:"csub"}, sub));
  const avail = series.filter(s => S(s.id) && S(s.id).t.length);
  if (!avail.length){
    const why = missingReason(series.map(s=>s.id));
    card.append(el("div",{class:"empty"}, "No data yet. ", why));
    card.append(provBlock(series.map(s=>s.id)));
    return card;
  }
  const box = el("div",{class:"chart",role:"img","aria-label":title});
  card.append(box);
  const tableBtn = el("button",{style:"font-size:12px;padding:3px 8px;margin-top:6px"},"Table view");
  const tableBox = el("div",{style:"display:none;margin-top:6px"});
  tableBtn.addEventListener("click",()=>{ const on = tableBox.style.display==="none"; tableBox.style.display = on?"block":"none"; tableBtn.textContent = on?"Hide table":"Table view"; if(on && !tableBox.firstChild) tableBox.append(seriesTable(avail)); });
  card.append(tableBtn, tableBox);
  if (note) card.append(el("div",{class:"csub",style:"margin-top:6px"}, note));
  card.append(provBlock(series.map(s=>s.id)));
  requestAnimationFrame(()=>drawChart(box, {series:avail, type, unit, stack, zero, std, bands}));
  return card;
}

function zscore(p){ const v=p.map(x=>x[1]); const m=v.reduce((a,b)=>a+b,0)/v.length; const sd=Math.sqrt(v.reduce((a,b)=>a+(b-m)**2,0)/Math.max(v.length-1,1))||1; return p.map(([t,x])=>[t,(x-m)/sd]); }

function drawChart(box, {series, type, unit, stack, zero, std, bands}){
  const ch = echarts.init(box, null, {renderer:"svg"});
  state.charts.push(ch);
  const ink2 = css("--ink2"), muted=css("--muted"), grid=css("--grid"), axis=css("--axis"), surface=css("--surface"), ink=css("--ink");
  const brks = breaksFor(series.map(s=>s.id));
  const cut = cutoff();
  const marks = brks.filter(b => String(b.date) >= cut).map(b => ({xAxis:String(b.date), label:{formatter:b.id.replace(/_/g," "), color:muted, fontSize:10, position:"insideEndTop"}, lineStyle:{color:axis, type:"solid", width:1}}));
  const opt = {
    animation:false, backgroundColor:"transparent",
    grid:{left:8,right:16,top:series.length>1?(series.length>5?52:34):14,bottom:8,containLabel:true},
    legend: series.length>1 ? {top:0,left:0,itemWidth:14,itemHeight:type==="line"?2:8,textStyle:{color:ink2,fontSize:12},icon:type==="line"?"rect":"roundRect"} : undefined,
    tooltip:{trigger:"axis",axisPointer:{type:"line",lineStyle:{color:axis}},backgroundColor:surface,borderColor:css("--border"),textStyle:{color:ink,fontSize:12},
      valueFormatter:v=> v==null?"–":fmt(v, Math.abs(v)<100?2:0)+(std?" sd":unit==="%"||unit==="pp"?" "+unit:"")},
    xAxis:{type:"time",axisLine:{lineStyle:{color:axis}},axisTick:{show:false},axisLabel:{color:muted,fontSize:11,hideOverlap:true},splitLine:{show:false}},
    yAxis:{type:"value",scale:!zero,axisLabel:{color:muted,fontSize:11,formatter:axfmt},splitLine:{lineStyle:{color:grid,width:1}},name:std?"standardised (sd)":"",nameTextStyle:{color:muted,fontSize:11,align:"left"}},
    series: series.map((s,i) => {
      let data = pts(s.id); if (std) data = zscore(data);
      const color = css(SERIES_VARS[(s.slot ?? i) % 8]);
      const base = {name:s.label||S(s.id).meta.name||s.id, data, color};
      if ((s.type||type)==="bar") return {...base, type:"bar", stack: stack?"a":undefined, barMaxWidth:24, itemStyle:{borderRadius: stack?0:[4,4,0,0], borderColor: stack?surface:undefined, borderWidth: stack?1:0}, emphasis:{focus:"series"}};
      return {...base, type:"line", showSymbol:false, symbolSize:8, lineStyle:{width:2,cap:"round",join:"round"}, connectNulls:false, emphasis:{focus:"series"}};
    })
  };
  if (marks.length) opt.series[0].markLine = {symbol:"none", silent:false, data:marks, tooltip:{show:true, formatter:p=>brks.find(b=>String(b.date)===p.value || b.id.replace(/_/g," ")===p.name)?.what||p.name}};
  if (bands && opt.series[0]) opt.series[0].markLine = {...(opt.series[0].markLine||{symbol:"none",data:[]}), data:[...(opt.series[0].markLine?.data||[]), ...bands.map(y=>({yAxis:y,label:{show:false},lineStyle:{color:axis,type:"solid",width:1}}))]};
  ch.setOption(opt);
}

function seriesTable(series){
  const ids = series.map(s=>s.id); const map = new Map();
  ids.forEach((id,j)=>pts(id).forEach(([t,v])=>{ if(!map.has(t)) map.set(t, Array(ids.length).fill(null)); map.get(t)[j]=v; }));
  const rows = [...map.entries()].sort((a,b)=>b[0].localeCompare(a[0]));
  const tbl = el("table"); const thead = el("tr",{}, el("th",{},"Period"), ...ids.map(id=>el("th",{}, S(id)?.meta?.name||id)));
  tbl.append(el("thead",{},thead)); const tb = el("tbody");
  rows.forEach(([t,vals]) => tb.append(el("tr",{}, el("td",{},t), ...vals.map(v=>el("td",{class:"num"}, fmt(v,2))))));
  tbl.append(tb); return el("div",{class:"tablewrap",style:"max-height:260px"}, tbl);
}

function provBlock(ids){
  const p = el("div",{class:"prov"});
  const det = el("details"); det.append(el("summary",{}, `Datasets (${ids.length}): trace each series`));
  const list = el("div",{class:"mono"});
  ids.forEach(id => {
    const s = S(id);
    const row = el("div",{style:"margin:3px 0"});
    row.append(el("b",{},id), " — ");
    if (!s){ row.append("not in store"); list.append(row); return; }
    const pr = s.prov;
    row.append(`${pr.tier}`, " · ", pr.source, " · vintage ", pr.vintage||"?", " · ", pr.lineage||"");
    if (pr.url){ row.append(" · "); row.append(el("a",{href:pr.url,target:"_blank",rel:"noopener"},"source")); }
    if (pr.raw_file){ row.append(" · raw: ", pr.raw_file); }
    if (s.note) row.append(" · ", s.note);
    if (pr.tier==="fallback") row.append(el("b",{style:"color:var(--ink)"}," · FALLBACK SOURCE"));
    list.append(row);
  });
  det.append(list); p.append(det);
  const l = ids.map(last).filter(Boolean).sort((a,b)=>b.t.localeCompare(a.t))[0];
  if (l) p.prepend(el("span",{},`Latest period ${l.t}`));
  return p;
}

function missingReason(ids){
  const st = state.data?.source_status || {};
  const reach = st._reachability || {};
  const down = Object.entries(reach).filter(([k,v])=>!v.ok).map(([k])=>k);
  if (!state.data?.catalog || !Object.keys(state.data.catalog).length) return "The store is empty: no source has been ingested yet." + (down.length?` Unreachable from the build environment: ${down.join(", ")}.`:"");
  return down.length ? `Unreachable at last build: ${down.join(", ")}. See Data & sources.` : "Series not produced at last build; see Data & sources.";
}

  for (const [id,lab,u] of T){
    const l = last(id); const s=S(id);
    tiles.append(el("div",{class:"tile"}, el("div",{class:"lab"},lab), el("div",{class:"val"}, l?fmt(l.v, Math.abs(l.v)<100?1:0):"–"),
      el("div",{class:"meta"}, l?`${u} · ${l.t} · ${s.prov.source}${s.prov.tier==="fallback"?" (fallback)":""}`:`${u} · no data`)));
  }
  out.push(tiles);
  const g = el("div",{class:"grid"});
  g.append(chartCard({title:"Activity momentum", sub:"% y/y, 3-month average · NBS", unit:"%",
    series:[{id:"ip.yoy~3mma",label:"IP"},{id:"retail.yoy~3mma",label:"Retail"},{id:"fai.ytd~cyoy~3mma",label:"FAI (single month)"}]}));
  g.append(chartCard({title:"Credit and fiscal impulse", sub:"Δ12m of 12-month flow, % of GDP", unit:"%", zero:true,
    series:[{id:"tsf.flow_ex_govt~impulse",label:"Credit ex-govt"},{id:"lgb.new_total~impulse",label:"New local bonds"},{id:"tsf.govt_bonds~impulse",label:"Govt bonds (TSF)"}]}));
  out.push(g);
  out.push(el("h2",{},"Leading-indicator verdicts"));
  const ll = state.data?.analytics?.lead_lag || [];
  const tb = el("table"); tb.append(el("thead",{},el("tr",{},...["Pair","Verdict","Best lead","Prewhitened corr","Placebo p","Granger p","n"].map(h=>el("th",{},h)))));
  const body = el("tbody");
  ll.forEach(r => body.append(el("tr",{}, el("td",{},r.label), el("td",{}, r.verdict || r.status), el("td",{class:"num"}, r.best_lead??"–"),

      body.append(el("tr",{},el("td",{class:"mono"},id),el("td",{},s.meta.name||""),el("td",{},s.meta.unit||""),el("td",{},s.t[s.t.length-1]),el("td",{class:"num"},fmt(s.v[s.v.length-1],2)),el("td",{},s.prov.tier),el("td",{}, s.prov.url?el("a",{href:s.prov.url,target:"_blank",rel:"noopener"},s.prov.source):s.prov.source),el("td",{},s.prov.vintage),el("td",{class:"mono"},s.prov.lineage),el("td",{class:"mono"},s.prov.raw_file)));
    }); tb.append(body); wrap.append(tb); };
  q.addEventListener("input", draw); draw();
  out.push(q, wrap);
  out.push(el("h2",{},"Structural-break register"));
  const t3 = el("table"); t3.append(el("thead",{},el("tr",{},...["Id","Date","Series","What","Treatment","Status"].map(h=>el("th",{},h)))));
  const b3 = el("tbody"); (d.breaks||[]).forEach(b=>b3.append(el("tr",{},el("td",{class:"mono"},b.id),el("td",{},String(b.date)+(b.end?` → ${b.end}`:"")),el("td",{class:"mono"},(b.series||[]).join(", ")),el("td",{},b.what),el("td",{},b.treatment),el("td",{},b.status))));
  t3.append(b3); out.push(el("div",{class:"tablewrap"},t3));
  return out;
}

// ---------------------------------------------------------------- shell
function render(){
  state.charts.forEach(c=>c.dispose()); state.charts = [];
  const d = state.data || {};
  const meta = d.meta || {};
  document.getElementById("asof").textContent = meta.built_at ? `Data built ${meta.built_at.replace("T"," ").replace("Z"," UTC")} · ${meta.n_series} series` : "No build yet";
  document.getElementById("refresh-state").textContent = window.__INLINE_DATA__ ? "Snapshot (data embedded)" : state.lastLoad ? `Checked ${state.lastLoad.toLocaleTimeString()} · auto-refresh every ${REFRESH_MIN} min` : "";
  const banner = document.getElementById("banner"); banner.textContent = "";
  const reach = d.source_status?._reachability || {};
  const down = Object.entries(reach).filter(([k,v])=>!v.ok).map(([k])=>k);
  const nfb = Object.values(d.catalog||{}).filter(s=>s.prov.tier==="fallback").length;
  if (!d.catalog || !Object.keys(d.catalog).length) banner.append(el("div",{class:"banner"}, el("strong",{},"No data in the store yet. "), down.length?`The build environment could not reach: ${down.join(", ")}. Charts fill in when a build can reach the sources.`:"Run the build to populate the store."));
  else if (down.length || nfb) banner.append(el("div",{class:"banner"}, el("strong",{},"Partial coverage. "), down.length?`Unreachable at last build: ${down.join(", ")}. `:"", nfb?`${nfb} series come from fallback sources and are marked as such.`:""));
  const tabs = document.getElementById("tabs"); tabs.textContent="";
  for (const [k,v] of Object.entries(VIEWS)) tabs.append(el("button",{role:"tab","aria-selected":String(state.tab===k),onclick:()=>{state.tab=k; save(); render();}}, v.label));
  const rg = document.getElementById("range"); rg.textContent="";
  RANGES.forEach(([l,y])=>rg.append(el("button",{"aria-pressed":String(state.range===y),onclick:()=>{state.range=y; save(); render();}}, l)));
  const vf = document.getElementById("viewfilters"); vf.textContent="";
  const view = VIEWS[state.tab] || VIEWS.overview;
  for (const [k,opts] of Object.entries(view.filters||{})){
    const cur = state.mode[k] || opts[0][0];
    const seg = el("span",{class:"seg"}); opts.forEach(([v,l])=>seg.append(el("button",{"aria-pressed":String(cur===v),onclick:()=>{state.mode[k]=v; render();}}, l)));
    vf.append(seg);
  }
  const main = document.getElementById("main"); main.textContent="";
  let content = view.render();
  const needsGrid = ["gdp","activity","credit","property","bonds","projects"].includes(state.tab);
  if (needsGrid){ const g=el("div",{class:"grid"}); content.forEach(c=>g.append(c)); main.append(g); }
  else content.forEach(c=>main.append(c));
}
window.addEventListener("resize", ()=>state.charts.forEach(c=>c.resize()));
document.getElementById("refresh").addEventListener("click", load);
document.getElementById("theme").addEventListener("click", ()=>{
  const root=document.documentElement; const dark = root.dataset.theme ? root.dataset.theme==="dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme = dark ? "light" : "dark"; render();
});
load();
</script>
