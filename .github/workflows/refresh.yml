name: refresh-data

# Runs the full pipeline on GitHub's runners (open internet), commits the updated store,
# derived data, validation report and app JSON, and publishes site/ to GitHub Pages.
on:
  schedule:
    # 02:20 and 10:20 UTC daily (10:20/18:20 Beijing): after NBS (10:00 BJT) and PBoC/MOF releases
    - cron: "20 2,10 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Unit and integration tests
        run: python -m pytest -q
      - name: Build (fetch, derive, analyse, validate, export)
        run: python -m cetracker.build
      - name: Fail on FAIL-status validation checks
        run: |
          python - <<'PY'
          import json, sys
          v = json.load(open("site/data/validation.json"))
          bad = [x["id"] for x in v if x["status"] == "FAIL"]
          print("FAIL checks:", bad)
          sys.exit(1 if bad else 0)
          PY
      - name: Commit data
        if: always()
        run: |
          git config user.name "tracker-bot"
          git config user.email "tracker-bot@users.noreply.github.com"
          git add data/ site/ docs/validation_report.md
          git diff --cached --quiet || git commit -m "Data refresh $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
      - uses: actions/upload-pages-artifact@v3
        if: always()
        with:
          path: site
  deploy:
    needs: refresh
    if: always()
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
