name: probe-sources
# Development aid: fetch candidate endpoints from a GitHub runner and commit raw responses.
on:
  workflow_dispatch: {}
  push:
    branches: ["claude/**"]
    paths: ["tools/probe.py", ".github/workflows/probe.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests
      - run: python tools/probe.py
      - name: Commit probe output
        run: |
          git config user.name "tracker-bot"
          git config user.email "tracker-bot@users.noreply.github.com"
          git add probe/
          git diff --cached --quiet && exit 0
          git commit -m "Probe output $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
          for i in 1 2 3 4; do
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push origin HEAD:"${GITHUB_REF_NAME}" && exit 0
            sleep $((i * 5))
          done
          exit 1
