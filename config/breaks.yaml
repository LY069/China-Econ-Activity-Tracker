# Structural-break register. Each entry is annotated on every chart of the affected series
# and is used by analytics (break dummies / sample splits). `verify` lists what must be
# checked against the primary source on first fetch; `status` records whether it was.
- id: TSF_2018_ABS_WRITEOFF
  date: 2018-07-31
  series: [tsf.*]
  what: PBoC adds depository-institution ABS and loan write-offs to TSF.
  treatment: Use PBoC restated history; flag pre-break flows.
  status: unverified
- id: TSF_2018_LG_SPECIAL
  date: 2018-09-30
  series: [tsf.*]
  what: Local-government special bonds added to TSF.
  treatment: Use restated history; TSF ex-govt-bonds removes the government component consistently.
  status: unverified
- id: TSF_2019_GOVT_BONDS
  date: 2019-12-31
  series: [tsf.*]
  what: Treasury bonds and LG general bonds added (government bonds fully in TSF); exchange ABS moved into corporate bonds.
  treatment: Use restated history. Government-bond component only consistent from the earliest month PBoC restated.
  status: unverified
- id: M2_2011_DEFINITION
  date: 2011-10-31
  series: [money.m2*]
  what: M2 adds housing provident fund centre deposits and non-depository FI deposits.
  treatment: Flag; y/y in the 12 months after is not like-for-like.
  status: unverified
- id: M2_2018_MMF
  date: 2018-01-31
  series: [money.m2*]
  what: Money-market-fund holdings by non-depository institutions replace MMF deposits in M2.
  treatment: Flag.
  status: unverified
- id: M1_2025_DEFINITION
  date: 2025-01-31
  series: [money.m1*, money.m1_m2_gap]
  what: M1 redefined to include household demand deposits and non-bank payment institutions' client reserves.
  treatment: Published y/y is on new definition vs restated base; level series breaks. Gap series annotated; pre/post analysis split.
  status: unverified
- id: FAI_2018_DATA_QUALITY
  date: 2018-12-31
  series: [fai.*]
  what: NBS statistical-enforcement corrections cut FAI levels; published growth on comparable basis diverges from levels.
  treatment: Implied comparable base reconstructed; y/y gap log.
  status: unverified
- id: COVID_BASE
  date: 2020-01-31
  end: 2022-12-31
  series: ["*"]
  what: 2020 collapse and 2021 rebound distort y/y; NBS published 2-year average growth in 2021.
  treatment: 2019-based CAGR shown for 2021-2022; analytics run with and without 2020-01..2021-12.
  status: n/a
- id: NBS_ABOVE_SIZE_SAMPLE
  date: annual
  series: [ip.*, retail.*, fai.*]
  what: Above-designated-size sample (IP: revenue >= RMB20m since 2011) re-drawn each January.
  treatment: Never compute y/y from published levels across years; reconstruct implied comparable base.
  status: n/a
- id: GDP_CENSUS_2023
  date: 2023-12-31
  series: [gdp.*]
  what: 5th National Economic Census revises nominal GDP level up (published Dec 2024); quarterly history revised.
  treatment: Latest vintage used; vintage store keeps pre-revision values for real-time tests.
  status: unverified
- id: LGB_SWAP_2015
  date: 2015-05-31
  end: 2018-12-31
  series: [lgb.*]
  what: 2015-18 debt-swap (置换) bonds; refinancing-type issuance not new money.
  treatment: Classified as swap refinancing.
  status: n/a
- id: LGB_SPECIAL_REFI_2023
  date: 2023-10-31
  end: 2023-12-31
  series: [lgb.*]
  what: Special refinancing bonds (~RMB1.4trn) to repay hidden debt.
  treatment: Classified as debt-swap refinancing.
  status: unverified
- id: LGB_SWAP_2024
  date: 2024-11-30
  end: 2026-12-31
  series: [lgb.*]
  what: RMB6trn refinancing quota (2trn/yr 2024-26) to swap hidden debt; plus up to 0.8trn/yr of new special bonds for swaps.
  treatment: Debt-swap refinancing separated; new special bonds earmarked for swaps cannot be separated at aggregate level - flagged.
  status: n/a
- id: CPI_PPI_REBASE_2026
  date: 2026-01-31
  series: [prices.*]
  what: Five-yearly CPI/PPI basket and weight rotation.
  treatment: Flag; deflators chain-linked through y/y rates.
  status: unverified
- id: JANFEB_COMBINED
  date: annual
  series: [ip.*, retail.*, fai.*, re.*]
  what: NBS publishes January and February combined for IP, FAI, retail and property.
  treatment: See methods - Jan/Feb split rule.
  status: n/a
